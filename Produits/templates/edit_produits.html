{% extends 'base.html' %}
{% block body %}
<h2>Modifier le produit</h2>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div>
    <label for="nom">Nom</label>
    <input type="text" id="nom" name="nom" required value="{{ produit.nom }}" />
  </div>
  <div>
    <label for="categorie">Catégorie</label>
    <select id="categorie" name="categorie">
      <option value="">-- Choisir --</option>
      {% for c in categories %}
      <option value="{{ c.id }}" {% if produit.categorie and produit.categorie.id == c.id %}selected{% endif %}>{{ c.nom }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="prix">Prix</label>
    <input type="number" id="prix" name="prix" step="1" min="0" required value="{{ produit.prix }}" />
  </div>
  <div>
    <label for="quantite">Quantité</label>
    <input type="number" id="quantite" name="quantite" step="1" min="0" required value="{{ produit.quantite }}" />
  </div>
  <div>
    <label for="date_expiration">Date d'expiration</label>
    <input type="date" id="date_expiration" name="date_expiration" value="{{ produit.date_expiration|date:'Y-m-d' }}" />
  </div>
  <div>
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3">{{ produit.description }}</textarea>
  </div>
  <div>
    <label for="image">Image</label>
    {% if produit.image %}
      <img src="{{ produit.image.url }}" alt="{{ produit.nom }}" style="height:60px; display:block; margin-bottom:8px" />
    {% endif %}
    <input type="file" id="image" name="image" accept="image/*" />
  </div>
  <button type="submit">Enregistrer</button>
  <a href="{% url 'liste' %}">Annuler</a>
</form>
{% endblock %}
