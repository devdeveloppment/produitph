{% extends 'base.html' %}
{% block body %}
<h2>Clients</h2>
<form method="post" action="{% url 'ajout-client' %}" style="margin-bottom:12px; display:flex; gap:8px;">
  {% csrf_token %}
  <input type="text" name="name" placeholder="Nom du client" required />
  <button type="submit">Ajouter</button>
</form>
<form method="get" style="margin-bottom:12px; display:flex; gap:8px;">
  <input type="text" name="q" placeholder="Rechercher un client" value="{{ q }}" />
  <button type="submit">Rechercher</button>
  <a href="{% url 'ajout-client' %}">Ajouter un client</a>
  <a href="{% url 'liste' %}">Produits</a>
  <a href="{% url 'ventes' %}">Ventes</a>
</form>
<table class="products-table">
  <thead>
    <tr>
      <th>Nom</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for c in clients %}
      <tr>
        <td>{{ c.name }}</td>
        <td style="display:flex; gap:6px;">
          <a href="{% url 'modifier-client' c.id %}">Modifier</a>
          <form method="post" action="{% url 'supprimer-client' c.id %}" onsubmit="return confirm('Supprimer ce client ?');">
            {% csrf_token %}
            <button type="submit">Supprimer</button>
          </form>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="2">Aucun client</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
